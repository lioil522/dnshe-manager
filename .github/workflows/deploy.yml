name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci
          cd frontend && npm ci

      - name: Setup & Bind Cloudflare D1 Database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          DB_ID="${CLOUDFLARE_D1_DATABASE_ID}"

          if [ -n "$DB_ID" ]; then
            echo "✅ 使用 GitHub Secret 中配置的 CLOUDFLARE_D1_DATABASE_ID: $DB_ID"
          else
            echo "🔍 尝试自动查询/创建 Cloudflare D1 数据库..."
            DB_LIST=$(npx wrangler d1 list --json 2>/dev/null || echo "[]")
            DB_ID=$(echo "$DB_LIST" | jq -r '.[] | select(.name=="dnshe-manager-db") | .uuid' 2>/dev/null || echo "")

            if [ -z "$DB_ID" ] || [ "$DB_ID" == "null" ]; then
              echo "⚡ 尝试创建 D1 数据库 [dnshe-manager-db]..."
              CREATE_RES=$(npx wrangler d1 create dnshe-manager-db --json 2>/dev/null || echo "")
              DB_ID=$(echo "$CREATE_RES" | jq -r '.result.uuid // .uuid // empty' 2>/dev/null || echo "")
            fi
          fi

          if [ -n "$DB_ID" ] && [ "$DB_ID" != "null" ]; then
            sed -i "s/change_me_to_your_d1_db_id/$DB_ID/g" wrangler.toml
            echo "🎉 成功将 D1 数据库 ID [$DB_ID] 绑定写入 wrangler.toml"
          else
            echo "⚠️ 未能获取到 D1 数据库 ID。请在 GitHub Secret 中添加 CLOUDFLARE_D1_DATABASE_ID"
          fi

      - name: Deploy Worker Backend
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Sync Optional Secrets to Worker (if set)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AES_KEY: ${{ secrets.AES_KEY }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          if [ -n "$AES_KEY" ]; then
            echo "🔐 正在同步更新 AES_KEY 密钥到 Cloudflare Worker..."
            echo "$AES_KEY" | npx wrangler secret put AES_KEY || true
          fi
          if [ -n "$ADMIN_TOKEN" ]; then
            echo "🔑 正在同步更新 ADMIN_TOKEN 口令到 Cloudflare Worker..."
            echo "$ADMIN_TOKEN" | npx wrangler secret put ADMIN_TOKEN || true
          fi
          if [ -n "$WEBHOOK_URL" ]; then
            echo "🔔 正在同步更新 WEBHOOK_URL 推送地址到 Cloudflare Worker..."
            echo "$WEBHOOK_URL" | npx wrangler secret put WEBHOOK_URL || true
          fi

      - name: Auto Fetch Worker Backend API Domain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "🔍 正在通过 Cloudflare REST API 查询 Worker [dnshe-manager-backend] 的实际域名..."

          # 1. 尝试查询账号下为该 Worker (dnshe-manager-backend) 绑定的自定义域名 Custom Domain / Routes
          DOMAINS_JSON=$(curl -s -X GET "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" || echo "{}")

          CUSTOM_DOMAIN=$(echo "$DOMAINS_JSON" | jq -r '.result[]? | select(.service=="dnshe-manager-backend") | .hostname' 2>/dev/null | head -n 1 || echo "")

          API_BASE_URL=""
          if [ -n "$CUSTOM_DOMAIN" ] && [ "$CUSTOM_DOMAIN" != "null" ]; then
            echo "🎉 成功抓取到绑定在 Cloudflare 上的 Worker 自定义域名: https://${CUSTOM_DOMAIN}"
            API_BASE_URL="https://${CUSTOM_DOMAIN}"
          else
            # 2. 若未绑定自定义域名，尝试查询全局默认的 workers.dev 域名
            SUBDOMAIN_JSON=$(curl -s -X GET "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" || echo "{}")
            
            WORKERS_SUBDOMAIN=$(echo "$SUBDOMAIN_JSON" | jq -r '.result.subdomain // empty' 2>/dev/null || echo "")

            if [ -n "$WORKERS_SUBDOMAIN" ]; then
              API_BASE_URL="https://dnshe-manager-backend.${WORKERS_SUBDOMAIN}.workers.dev"
              echo "✨ 成功获取到 Cloudflare 默认分配的 Worker 域名: ${API_BASE_URL}"
            fi
          fi

          if [ -n "$API_BASE_URL" ]; then
            echo "VITE_API_BASE_URL=${API_BASE_URL}" >> $GITHUB_ENV
            echo "✅ 成功注入环境变量 VITE_API_BASE_URL=${API_BASE_URL} 供前端构建"
          else
            echo "⚠️ 未能通过 Cloudflare API 自动提取出域名，前端将使用自适应降级识别模式"
          fi

      - name: Build Frontend
        env:
          VITE_API_BASE_URL: ${{ env.VITE_API_BASE_URL }}
        run: |
          cd frontend
          npm run build

      - name: Deploy Pages Frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "⚡ 检查/创建 Pages 项目 [dnshe-manager-frontend]..."
          npx wrangler pages project create dnshe-manager-frontend --production-branch=main || true
          echo "🚀 部署前端编译文件到 Cloudflare Pages..."
          npx wrangler pages deploy frontend/dist --project-name=dnshe-manager-frontend --branch=main
