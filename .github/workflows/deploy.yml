name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci
          cd frontend && npm ci

      - name: Setup & Bind Cloudflare D1 Database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "🔍 检查并获取 Cloudflare D1 数据库..."
          # 检查是否存在名为 dnshe-manager-db 的 D1 数据库
          DB_LIST=$(npx wrangler d1 list --json)
          DB_ID=$(echo "$DB_LIST" | jq -r '.[] | select(.name=="dnshe-manager-db") | .uuid')

          if [ -z "$DB_ID" ] || [ "$DB_ID" == "null" ]; then
            echo "⚡ 正在为您自动创建 D1 数据库 [dnshe-manager-db]..."
            CREATE_RES=$(npx wrangler d1 create dnshe-manager-db --json)
            DB_ID=$(echo "$CREATE_RES" | jq -r '.result.uuid // .uuid // empty')
            if [ -z "$DB_ID" ]; then
              # Fallback 正则提取 uuid
              DB_ID=$(echo "$CREATE_RES" | grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -n 1)
            fi
            echo "✅ 成功创建 D1 数据库，ID: $DB_ID"
            
            echo "📋 正在自动初始化数据库表结构 (schema.sql)..."
            npx wrangler d1 execute dnshe-manager-db --remote --file=./schema.sql -y
          else
            echo "✅ 找到已有 D1 数据库，ID: $DB_ID"
          fi

          if [ -z "$DB_ID" ]; then
            echo "❌ 无法自动获取 D1 数据库 ID，请手动创建 D1 数据库并在 wrangler.toml 中填入 database_id"
            exit 1
          fi

          # 替换 wrangler.toml 中的数据库 ID
          sed -i "s/change_me_to_your_d1_db_id/$DB_ID/g" wrangler.toml
          echo "🎉 已经将 D1 数据库 ID [$DB_ID] 写入 wrangler.toml"

      - name: Deploy Worker Backend
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build Frontend
        run: |
          cd frontend
          npm run build

      - name: Deploy Pages Frontend
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend/dist --project-name=dnshe-manager-frontend
